<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#414936"><meta name="description" content="СВОЁ — личная система организации жизни. Живи в своём ритме."><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>СВОЁ — Живи в своём ритме</title>
<style>
:root{--olive:#414936;--burgundy:#642f3d;--ochre:#a97835;--beige:#e8ddcb;--ivory:#f5efe5;--ink:#292b25;--muted:#77766d;--line:#ddd3c3;--paper:#fbf8f2;--shadow:0 8px 28px #302a2010}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px;line-height:1.45}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:94px}.top{padding:22px 22px 12px;background:linear-gradient(145deg,var(--olive),#30382c);color:var(--ivory);border-radius:0 0 26px 26px}.brand{display:flex;align-items:center;gap:12px}.sun{font-size:30px;color:#d5ad69}.brandname{font-family:Georgia,serif;font-size:30px;letter-spacing:.04em}.tagline{font-family:Georgia,serif;font-style:italic;color:#e8ddcb;margin:3px 0 0 43px;font-size:15px}.date{font-size:13px;color:#e8ddcbbd;margin-top:18px;letter-spacing:.04em}.content{padding:18px 18px 26px}.page-title{font-family:Georgia,serif;font-weight:500;font-size:29px;margin:5px 0;color:var(--olive)}.subtle{color:var(--muted);font-size:14px}.card{background:#fffdf9;border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0;box-shadow:var(--shadow)}.card h2{font:500 20px Georgia,serif;color:var(--olive);margin:0 0 8px}.card h3{font-size:16px;margin:12px 0 8px}.eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ochre);font-weight:700}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:#fff;color:var(--ink);font-size:14px}.chip.active{background:var(--olive);border-color:var(--olive);color:white}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.btn{border:0;border-radius:12px;padding:11px 15px;background:var(--olive);color:white;font-weight:600}.btn.secondary{background:#eee8dc;color:var(--olive);border:1px solid var(--line)}.btn.burgundy{background:var(--burgundy)}.btn.small{padding:7px 10px;font-size:13px}.input,select,textarea{width:100%;border:1px solid var(--line);background:#fffdf9;border-radius:11px;padding:12px;color:var(--ink);margin:5px 0 10px}.fieldlabel{display:block;font-size:13px;color:var(--muted);margin-top:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.task{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid #eee8dd}.check{width:21px;height:21px;accent-color:var(--olive);margin-top:2px}.tasktitle{font-weight:600}.taskmeta{font-size:12px;color:var(--muted);margin-top:2px}.done .tasktitle{text-decoration:line-through;color:#999}.pill{font-size:11px;border-radius:99px;padding:3px 8px;background:#eee8dc;color:var(--olive);white-space:nowrap}.timeline{border-left:2px solid var(--line);margin:12px 0 0 8px;padding-left:15px}.timeitem{position:relative;padding:0 0 16px}.timeitem:before{content:"";position:absolute;left:-22px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--ochre);border:2px solid var(--paper)}.empty{padding:16px;text-align:center;color:var(--muted);font-size:14px}.nav{position:fixed;z-index:5;bottom:0;left:0;right:0;background:#fbf8f2f2;backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 5px calc(8px + env(safe-area-inset-bottom));gap:2px}.nav button{border:0;background:transparent;color:var(--muted);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 10px;border-radius:12px;min-width:62px}.nav button span:first-child{font-size:20px}.nav button.active{color:var(--burgundy);background:#642f3d10;font-weight:700}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.tabs button{border:1px solid var(--line);background:transparent;border-radius:9px;padding:8px 11px;color:var(--muted);font-size:13px}.tabs button.active{background:var(--beige);color:var(--ink);border-color:var(--beige)}.modalback{position:fixed;inset:0;background:#16181277;z-index:10;display:flex;align-items:flex-end;justify-content:center}.modal{background:var(--paper);border-radius:22px 22px 0 0;padding:20px;width:min(100%,700px);max-height:90vh;overflow:auto}.modal h2{font:500 24px Georgia,serif;color:var(--olive);margin:0 0 12px}.close{border:0;background:#eee8dc;border-radius:50%;width:34px;height:34px}.hidden{display:none!important}.notice{background:#f0e8d9;border-left:3px solid var(--ochre);padding:12px;border-radius:8px;font-size:14px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.day{border:1px solid var(--line);border-radius:10px;padding:9px 2px;font-size:12px;background:#fff;min-height:48px}.day.today{background:var(--olive);color:white;border-color:var(--olive)}.day.selected{outline:2px solid var(--burgundy);outline-offset:1px}.day small{display:block;color:inherit;opacity:.7}.sectionlink{display:flex;justify-content:space-between;align-items:center;padding:14px 2px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}.sectionlink:last-child{border:0}.footer-note{text-align:center;color:var(--muted);font:italic 13px Georgia,serif;margin:24px 0 8px}.itemline{padding:12px 0;border-bottom:1px solid #eee8dd}.itemline:last-child{border:0}.itemactions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.monthnav{display:flex;align-items:center;justify-content:space-between;gap:10px}.monthnav h2{text-align:center;flex:1;text-transform:capitalize}.daybutton{border:1px solid var(--line);border-radius:10px;padding:8px 2px;font-size:12px;background:#fff;min-height:48px;color:var(--ink)}.daybutton.today{background:var(--olive);color:white}.daybutton.selected{outline:2px solid var(--burgundy);outline-offset:1px}.mutedline{color:var(--muted);font-size:13px}
@media(min-width:600px){.content{padding:24px 28px}.top{padding:26px 30px}.modalback{align-items:center}.modal{border-radius:22px}}
</style></head><body><div class="app"><header class="top"><div class="brand"><span class="sun">☼</span><span class="brandname">своё</span></div><div class="tagline">Живи в своём ритме.</div><div class="date" id="todayDate"></div></header><main class="content" id="view"></main><nav class="nav" id="nav"><button data-page="day" class="active"><span>☼</span><span>Мой день</span></button><button data-page="calendar"><span>▦</span><span>Календарь</span></button><button data-page="tasks"><span>☷</span><span>Мои задачи</span></button><button data-page="life"><span>❧</span><span>Моя жизнь</span></button><button data-page="diary"><span>✎</span><span>Дневник</span></button></nav></div><div id="modalRoot"></div>
<script>
const KEY='svoe_v2_state';
const defaults={energy:'',mood:'',tasks:[],notes:[],viewMode:'timeline',closedState:false,evening:{},homeItems:[],healthItems:[],habits:[],challenges:[],habitLogs:{},calendarSelected:''};
let state;try{state={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){state={...defaults}};
for(const k of ['tasks','notes','homeItems','healthItems','habits','challenges'])if(!Array.isArray(state[k]))state[k]=[];
if(!state.habitLogs||typeof state.habitLogs!=='object')state.habitLogs={};
state.notes.forEach((n,i)=>{if(n.id==null)n.id=Date.now()+i});
let page='day',lifeSection='',calendarDate=state.calendarSelected||today(),calendarMonth=new Date();calendarMonth.setDate(1);
const $=s=>document.querySelector(s), save=()=>localStorage.setItem(KEY,JSON.stringify(state));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dateLabel(s=today()){return new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date(s+'T12:00:00'))}
$('#todayDate').textContent=dateLabel();
function setPage(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)setPage(b.dataset.page)});
function modal(title,body){$('#modalRoot').innerHTML=`<div class="modalback" id="backdrop"><div class="modal"><div class="row"><h2>${title}</h2><button class="close" id="modalClose">×</button></div>${body}</div></div>`;$('#modalClose').onclick=closeModal;$('#backdrop').onclick=e=>{if(e.target.id==='backdrop')closeModal()}}
function closeModal(){$('#modalRoot').innerHTML=''}
function dayTasks(date=today()){return state.tasks.filter(t=>t.date===date).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'))}
function taskCard(t){return `<div class="task ${t.done?'done':''}"><input class="check" type="checkbox" data-done="${t.id}" ${t.done?'checked':''}><div style="flex:1"><div class="row"><span class="tasktitle">${esc(t.title)}</span><span class="pill">${esc(t.priority||'По возможности')}</span></div><div class="taskmeta">${esc(t.category||'Без категории')}${t.date?' · '+t.date:''}${t.time?' · '+t.time:''}${t.duration?' · '+t.duration+' мин.':''}</div></div><button class="btn secondary small" data-edit="${t.id}">Изменить</button></div>`}
function renderDay(){let tasks=dayTasks(),open=tasks.filter(t=>!t.done);return `<div class="eyebrow">ТВОЙ ДЕНЬ</div><h1 class="page-title">Сегодня</h1><p class="subtle">Пусть планы поддерживают тебя, а не наоборот.</p>${!state.closedState&&!state.energy&&!state.mood?`<div class="card"><div class="row"><h2>Как ты сегодня?</h2><button class="close" id="closeState">×</button></div><p class="subtle">Если захочешь, отметь своё состояние. Это необязательно.</p><h3>Сколько у тебя сил?</h3><div class="chips">${['Почти нет сил','Мало сил','Умеренно','Хорошо','Много сил'].map(x=>`<button class="chip ${state.energy===x?'active':''}" data-energy="${x}">${x}</button>`).join('')}</div><h3>Что ты сейчас чувствуешь?</h3><div class="chips">${['Спокойствие','Радость','Воодушевление','Нейтральное состояние','Тревога','Грусть','Подавленность','Раздражение','Опустошённость','Растерянность','Не могу определить'].map(x=>`<button class="chip ${state.mood===x?'active':''}" data-mood="${x}">${x}</button>`).join('')}</div></div>`:''}${state.energy||state.mood?`<div class="card"><div class="row"><div><div class="eyebrow">МОЁ СОСТОЯНИЕ</div><strong>${esc(state.energy||'Не отмечено')}</strong><div class="subtle">${esc(state.mood||'Настроение не отмечено')}</div></div><button class="btn secondary small" id="editState">Изменить</button></div></div>`:''}<div class="card"><div class="row"><h2>План на сегодня</h2><div class="tabs" style="margin:0"><button data-mode="timeline" class="${state.viewMode==='timeline'?'active':''}">По времени</button><button data-mode="list" class="${state.viewMode==='list'?'active':''}">Списком</button></div></div><div class="row"><span class="subtle">${open.length} незавершённых дел</span><button class="btn small" id="quickAdd">＋ Добавить дело</button></div>${tasks.length?(state.viewMode==='list'?tasks.map(taskCard).join(''):`<div class="timeline">${tasks.map(t=>`<div class="timeitem">${t.time?`<div class="eyebrow">${esc(t.time)}</div>`:''}${taskCard(t)}</div>`).join('')}</div>`):`<div class="empty">На сегодня пока ничего не запланировано. Можно оставить день свободным.</div>`}</div><div class="card"><div class="row"><h2>Небольшая пауза</h2><span class="pill">без обязательств</span></div><p class="subtle">Оставь в дне немного пространства для отдыха и того, что тебе сейчас нужно.</p><button class="btn secondary small" id="addRest">Добавить время для отдыха</button></div><div class="card"><div class="eyebrow">ВЕЧЕР</div><h2>Завершение дня</h2><p class="subtle">Можно подвести итоги здесь или перейти к записи в дневнике. А можно ничего не делать.</p><div class="chips"><button class="btn secondary" id="eveningSummary">Итог дня</button><button class="btn secondary" id="toDiary">Открыть дневник</button></div></div>`}
function taskForm(t={}){modal(t.id?'Изменить задачу':'Новая задача',`<form id="taskForm"><label class="fieldlabel">Название дела *</label><input class="input" name="title" required value="${esc(t.title||'')}" placeholder="Например, подготовить материалы"><div class="grid2"><div><label class="fieldlabel">Категория</label><input class="input" name="category" value="${esc(t.category||'')}" placeholder="Личное, работа…"></div><div><label class="fieldlabel">Приоритет</label><select name="priority"><option ${t.priority==='Обязательно'?'selected':''}>Обязательно</option><option ${t.priority==='Желательно'?'selected':''}>Желательно</option><option ${!t.priority||t.priority==='По возможности'?'selected':''}>По возможности</option></select></div><div><label class="fieldlabel">Дата</label><input class="input" type="date" name="date" value="${esc(t.date||'')}"></div><div><label class="fieldlabel">Время</label><input class="input" type="time" name="time" value="${esc(t.time||'')}"></div><div><label class="fieldlabel">Длительность, мин.</label><input class="input" type="number" min="0" name="duration" value="${esc(t.duration||'')}"></div></div><label class="fieldlabel">Заметка</label><textarea class="input" name="note" rows="2">${esc(t.note||'')}</textarea><button class="btn" style="width:100%" type="submit">Сохранить задачу</button>${t.id?'<button class="btn secondary" style="width:100%;margin-top:8px" type="button" id="deleteTask">Удалить задачу</button>':''}</form>`);$('#taskForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.currentTarget),obj={id:t.id||Date.now(),title:String(f.get('title')||'').trim(),category:String(f.get('category')||'').trim()||'Без категории',priority:f.get('priority'),date:f.get('date'),time:f.get('time'),duration:f.get('duration'),note:f.get('note'),done:t.done||false};if(!obj.title)return;if(t.id)state.tasks=state.tasks.map(x=>x.id===t.id?obj:x);else state.tasks.push(obj);save();closeModal();render()};if(t.id)$('#deleteTask').onclick=()=>{if(confirm('Удалить задачу?')){state.tasks=state.tasks.filter(x=>x.id!==t.id);save();closeModal();render()}}}
function renderTasks(){let cats=[...new Set(state.tasks.map(t=>t.category||'Без категории'))];return `<div class="eyebrow">ТВОИ ДЕЛА</div><h1 class="page-title">Мои задачи</h1><p class="subtle">Здесь собраны все дела — в том числе те, которым пока не назначена дата.</p><div class="row"><span></span><button class="btn" id="fullAdd">＋ Новая задача</button></div>${cats.length?cats.map(c=>`<div class="card"><h2>${esc(c)}</h2>${state.tasks.filter(t=>(t.category||'Без категории')===c).sort((a,b)=>['Обязательно','Желательно','По возможности'].indexOf(a.priority)-['Обязательно','Желательно','По возможности'].indexOf(b.priority)).map(taskCard).join('')}</div>`).join(''):`<div class="card empty">Пока здесь пусто. Добавь задачу — дату можно назначить позже.</div>`}`}
function renderCalendar(){let y=calendarMonth.getFullYear(),m=calendarMonth.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),offset=(first.getDay()+6)%7;let title=new Intl.DateTimeFormat('ru-RU',{month:'long',year:'numeric'}).format(first);let cells=Array(offset).fill('<div></div>').join('')+Array.from({length:days},(_,i)=>{let n=i+1,ds=`${y}-${String(m+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`,count=state.tasks.filter(t=>t.date===ds).length;return `<button class="daybutton ${ds===today()?'today':''} ${ds===calendarDate?'selected':''}" data-date="${ds}">${n}<small>${count?'•':''}</small></button>`}).join('');let selected=dayTasks(calendarDate);return `<div class="eyebrow">ПЛАНЫ И СОБЫТИЯ</div><h1 class="page-title">Календарь</h1><div class="card"><div class="monthnav"><button class="btn secondary small" id="prevMonth" aria-label="Предыдущий месяц">‹</button><h2>${esc(title)}</h2><button class="btn secondary small" id="nextMonth" aria-label="Следующий месяц">›</button></div><div class="row"><span class="mutedline">Выбери дату, чтобы увидеть планы</span><button class="btn small" id="todayMonth">Сегодня</button></div><div class="week">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div class="subtle">${x}</div>`).join('')}${cells}</div></div><div class="card"><div class="row"><h2>${esc(dateLabel(calendarDate))}</h2><span class="pill">${selected.length} дел</span></div>${selected.length?selected.map(taskCard).join(''):'<div class="empty">На эту дату пока ничего не запланировано.</div>'}</div><div class="card"><h2>Все задачи с датой</h2>${state.tasks.filter(t=>t.date).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(taskCard).join('')||'<div class="empty">Задач с назначенной датой пока нет.</div>'}</div>`}
const lifeSections=[['home','Дом','Идеи для дома, семейные дела и покупки'],['health','Здоровье и движение','Движение, забота о себе и восстановление'],['habits','Привычки','Повторяющиеся действия в своём ритме'],['challenges','Мои челленджи','Личные и семейные цели без давления']];
function renderLife(){if(!lifeSection)return `<div class="eyebrow">ЛИЧНОЕ ПРОСТРАНСТВО</div><h1 class="page-title">Моя жизнь</h1><p class="subtle">Небольшие опоры для повседневной жизни.</p><div class="card">${lifeSections.map(([id,n,d])=>`<a class="sectionlink" href="#" data-life="${id}"><div><strong>${n}</strong><div class="subtle">${d}</div></div><span>›</span></a>`).join('')}</div>`;
if(lifeSection==='home')return renderHome();if(lifeSection==='health')return renderHealth();if(lifeSection==='habits')return renderHabits();if(lifeSection==='challenges')return renderChallenges();return ''}
function lifeHeader(title,desc,addId,addText){return `<button class="btn secondary small" id="lifeBack">← Моя жизнь</button><h1 class="page-title">${title}</h1><p class="subtle">${desc}</p><div class="row"><span></span><button class="btn small" id="${addId}">＋ ${addText}</button></div>`}
function renderHome(){return lifeHeader('Дом','Домашние дела, покупки, семейные планы и идеи.','addHome','Добавить запись')+`<div class="card"><h2>Моё пространство</h2><p class="subtle">Сохраняй здесь дела, списки покупок, идеи и семейные планы.</p>${state.homeItems.length?state.homeItems.slice().reverse().map(x=>`<div class="itemline"><div class="row"><strong>${esc(x.title)}</strong><span class="pill">${esc(x.kind||'Идея')}</span></div>${x.text?`<p class="subtle">${esc(x.text)}</p>`:''}<div class="itemactions"><button class="btn secondary small" data-home-edit="${x.id}">Изменить</button><button class="btn secondary small" data-home-del="${x.id}">Удалить</button></div></div>`).join(''):'<div class="empty">Здесь пока нет записей. Добавь первую идею или домашнее дело.</div>'}</div>`}
function renderHealth(){return lifeHeader('Здоровье и движение','Активности, небольшая забота о себе, самочувствие и восстановление.','addHealth','Добавить активность')+`<div class="card"><h2>Мои активности</h2><p class="subtle">Можно учитывать время, расстояние, количество или просто отмечать действие.</p>${state.healthItems.length?state.healthItems.slice().reverse().map(x=>`<div class="itemline"><strong>${esc(x.title)}</strong><div class="taskmeta">${esc(x.date)} · ${esc(x.amount||'Отметка')}${x.unit?' '+esc(x.unit):''}</div>${x.note?`<p class="subtle">${esc(x.note)}</p>`:''}<div class="itemactions"><button class="btn secondary small" data-health-edit="${x.id}">Изменить</button><button class="btn secondary small" data-health-del="${x.id}">Удалить</button></div></div>`).join(''):'<div class="empty">Пока нет записей. Добавь прогулку, тренировку или маленькую заботу о себе.</div>'}</div>`}
function renderHabits(){return lifeHeader('Привычки','Без серий и соревнований. Отмечай свой ритм и смотри историю.','addHabit','Новая привычка')+`<div class="card"><h2>Мои привычки</h2>${state.habits.length?state.habits.map(h=>{let done=!!(state.habitLogs[h.id]||{})[today()];return `<div class="itemline"><div class="row"><strong>${esc(h.title)}</strong><span class="pill">${esc(h.method||'Отметка')}</span></div>${h.light?`<p class="subtle">Облегчённый вариант: ${esc(h.light)}</p>`:''}<div class="row"><label class="chips"><input type="checkbox" data-habit-check="${h.id}" ${done?'checked':''}> Выполнено сегодня</label><span class="mutedline">${Object.values(state.habitLogs[h.id]||{}).filter(Boolean).length} отметок</span></div><div class="itemactions"><button class="btn secondary small" data-habit-edit="${h.id}">Изменить</button><button class="btn secondary small" data-habit-del="${h.id}">Удалить</button></div></div>`}).join(''):'<div class="empty">Пока нет привычек. Создай одну небольшую опору для себя.</div>'}</div>`}
function renderChallenges(){return lifeHeader('Мои челленджи','Личные цели, этапы и прогресс. Пауза — тоже допустимый выбор.','addChallenge','Новый челлендж')+`<div class="card"><h2>Мои цели</h2>${state.challenges.length?state.challenges.slice().reverse().map(c=>`<div class="itemline"><div class="row"><strong>${esc(c.title)}</strong><span class="pill">${esc(c.status||'Активен')}</span></div><p class="subtle">${esc(c.start||'Без даты начала')} ${c.end?'— '+esc(c.end):''}</p><div class="row"><span>${Number(c.progress)||0}${c.unit?' '+esc(c.unit):''}${c.goal?' из '+esc(c.goal):''}</span><button class="btn small" data-challenge-progress="${c.id}">Добавить прогресс</button></div>${c.goal?`<div style="height:7px;background:#eee8dc;border-radius:9px;margin:9px 0;overflow:hidden"><div style="height:100%;width:${Math.min(100,(Number(c.progress)||0)/Number(c.goal)*100)}%;background:var(--olive)"></div></div>`:''}<div class="itemactions"><button class="btn secondary small" data-challenge-edit="${c.id}">Изменить</button><button class="btn secondary small" data-challenge-pause="${c.id}">${c.status==='Пауза'?'Продолжить':'Пауза'}</button><button class="btn secondary small" data-challenge-del="${c.id}">Удалить</button></div></div>`).join(''):'<div class="empty">Здесь появятся твои личные челленджи и маленькие шаги к большим целям.</div>'}</div>`}
function renderDiary(){return `<div class="eyebrow">ЛИЧНОЕ ПРОСТРАНСТВО</div><h1 class="page-title">Дневник</h1><p class="subtle">Место для мыслей, воспоминаний и маленьких открытий.</p><div class="card"><h2>Что хочется сохранить?</h2><textarea id="diaryText" rows="5" placeholder="Запиши то, что важно именно сегодня…"></textarea><button class="btn" id="saveDiary">Сохранить запись</button></div>${state.notes.slice().reverse().map(n=>`<div class="card"><div class="row"><div class="eyebrow">${esc(n.date)}</div><span class="pill">Запись</span></div><p style="white-space:pre-wrap">${esc(n.text)}</p><div class="itemactions"><button class="btn secondary small" data-note-edit="${n.id}">Редактировать</button><button class="btn secondary small" data-note-del="${n.id}">Удалить</button></div></div>`).join('')||'<div class="empty">Пока нет записей. Здесь может начаться твоя история.</div>'}`}
function render(){let html=page==='day'?renderDay():page==='tasks'?renderTasks():page==='calendar'?renderCalendar():page==='life'?renderLife():renderDiary();$('#view').innerHTML=html;bind()}
function simpleForm(title,fields,initial,onSave,deleteText){modal(title,`<form id="simpleForm">${fields}<button class="btn" style="width:100%">Сохранить</button></form>`);$('#simpleForm').onsubmit=e=>{e.preventDefault();onSave(new FormData(e.currentTarget));closeModal();render()}}
function bind(){
 document.querySelectorAll('[data-energy]').forEach(b=>b.onclick=()=>{state.energy=b.dataset.energy;save();render()});document.querySelectorAll('[data-mood]').forEach(b=>b.onclick=()=>{state.mood=b.dataset.mood;save();render()});$('#closeState')?.addEventListener('click',()=>{state.closedState=true;save();render()});$('#editState')?.addEventListener('click',()=>{state.closedState=false;state.energy='';state.mood='';save();render()});
 $('#quickAdd')?.addEventListener('click',()=>{modal('Быстрое добавление',`<form id="quickForm"><label class="fieldlabel">Что нужно сделать?</label><input class="input" name="title" required placeholder="Название дела"><button class="btn" style="width:100%">Сохранить</button><button type="button" class="btn secondary" id="openFull" style="width:100%;margin-top:8px">Заполнить все параметры</button></form>`);$('#openFull').onclick=()=>{let title=$('#quickForm [name=title]').value;closeModal();taskForm({title,date:today()})};$('#quickForm').onsubmit=e=>{e.preventDefault();let title=String(new FormData(e.currentTarget).get('title')||'').trim();if(!title)return;state.tasks.push({id:Date.now(),title,category:'Без категории',priority:'По возможности',date:today(),time:'',done:false});save();closeModal();render()}});
 $('#fullAdd')?.addEventListener('click',()=>taskForm());document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>taskForm(state.tasks.find(t=>t.id==b.dataset.edit)));document.querySelectorAll('[data-done]').forEach(b=>b.onchange=()=>{let t=state.tasks.find(t=>t.id==b.dataset.done);if(t)t.done=b.checked;save();render()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.viewMode=b.dataset.mode;save();render()});$('#addRest')?.addEventListener('click',()=>taskForm({title:'Время для отдыха',category:'Здоровье и движение',priority:'По возможности',date:today()}));$('#toDiary')?.addEventListener('click',()=>setPage('diary'));
 $('#eveningSummary')?.addEventListener('click',()=>{let done=dayTasks().filter(t=>t.done).length,unfinished=dayTasks().filter(t=>!t.done).length;modal('Итог дня',`<div class="notice">Сегодня выполнено дел: <strong>${done}</strong>. Осталось незавершённых: <strong>${unfinished}</strong>. Это просто сводка, не оценка дня.</div><label class="fieldlabel">Как прошёл день?</label><textarea class="input" id="eveningNote" rows="4">${esc(state.evening[today()]||'')}</textarea><button class="btn" id="saveEvening" style="width:100%">Сохранить итог</button>`);$('#saveEvening').onclick=()=>{state.evening[today()]=$('#eveningNote').value;save();closeModal()}});
 $('#prevMonth')?.addEventListener('click',()=>{calendarMonth.setMonth(calendarMonth.getMonth()-1);render()});$('#nextMonth')?.addEventListener('click',()=>{calendarMonth.setMonth(calendarMonth.getMonth()+1);render()});$('#todayMonth')?.addEventListener('click',()=>{calendarMonth=new Date();calendarMonth.setDate(1);calendarDate=today();state.calendarSelected=calendarDate;save();render()});document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{calendarDate=b.dataset.date;state.calendarSelected=calendarDate;save();render()});
 $('#saveDiary')?.addEventListener('click',()=>{let text=$('#diaryText').value.trim();if(text){state.notes.push({id:Date.now(),date:today(),text});save();render()}});document.querySelectorAll('[data-note-edit]').forEach(b=>b.onclick=()=>{let n=state.notes.find(x=>x.id==b.dataset.noteEdit);modal('Редактировать запись',`<form id="noteForm"><label class="fieldlabel">Текст записи</label><textarea class="input" name="text" rows="7" required>${esc(n.text)}</textarea><button class="btn" style="width:100%">Сохранить изменения</button></form>`);$('#noteForm').onsubmit=e=>{e.preventDefault();n.text=new FormData(e.currentTarget).get('text').trim();save();closeModal();render()}});document.querySelectorAll('[data-note-del]').forEach(b=>b.onclick=()=>{if(confirm('Удалить эту запись из дневника?')){state.notes=state.notes.filter(n=>n.id!=b.dataset.noteDel);save();render()}});
 document.querySelectorAll('[data-life]').forEach(a=>a.onclick=e=>{e.preventDefault();lifeSection=a.dataset.life;render()});$('#lifeBack')?.addEventListener('click',()=>{lifeSection='';render()});
 $('#addHome')?.addEventListener('click',()=>homeForm());document.querySelectorAll('[data-home-edit]').forEach(b=>b.onclick=()=>homeForm(state.homeItems.find(x=>x.id==b.dataset.homeEdit)));document.querySelectorAll('[data-home-del]').forEach(b=>b.onclick=()=>{if(confirm('Удалить запись?')){state.homeItems=state.homeItems.filter(x=>x.id!=b.dataset.homeDel);save();render()}});
 $('#addHealth')?.addEventListener('click',()=>healthForm());document.querySelectorAll('[data-health-edit]').forEach(b=>b.onclick=()=>healthForm(state.healthItems.find(x=>x.id==b.dataset.healthEdit)));document.querySelectorAll('[data-health-del]').forEach(b=>b.onclick=()=>{if(confirm('Удалить запись об активности?')){state.healthItems=state.healthItems.filter(x=>x.id!=b.dataset.healthDel);save();render()}});
 $('#addHabit')?.addEventListener('click',()=>habitForm());document.querySelectorAll('[data-habit-edit]').forEach(b=>b.onclick=()=>habitForm(state.habits.find(x=>x.id==b.dataset.habitEdit)));document.querySelectorAll('[data-habit-del]').forEach(b=>b.onclick=()=>{if(confirm('Удалить привычку и её отметки?')){let id=b.dataset.habitDel;state.habits=state.habits.filter(x=>x.id!=id);delete state.habitLogs[id];save();render()}});document.querySelectorAll('[data-habit-check]').forEach(b=>b.onchange=()=>{let id=b.dataset.habitCheck;if(!state.habitLogs[id])state.habitLogs[id]={};if(b.checked)state.habitLogs[id][today()]=true;else delete state.habitLogs[id][today()];save();render()});
 $('#addChallenge')?.addEventListener('click',()=>challengeForm());document.querySelectorAll('[data-challenge-edit]').forEach(b=>b.onclick=()=>challengeForm(state.challenges.find(x=>x.id==b.dataset.challengeEdit)));document.querySelectorAll('[data-challenge-del]').forEach(b=>b.onclick=()=>{if(confirm('Удалить челлендж?')){state.challenges=state.challenges.filter(x=>x.id!=b.dataset.challengeDel);save();render()}});document.querySelectorAll('[data-challenge-pause]').forEach(b=>b.onclick=()=>{let c=state.challenges.find(x=>x.id==b.dataset.challengePause);c.status=c.status==='Пауза'?'Активен':'Пауза';save();render()});document.querySelectorAll('[data-challenge-progress]').forEach(b=>b.onclick=()=>{let c=state.challenges.find(x=>x.id==b.dataset.challengeProgress);modal('Добавить прогресс',`<form id="progressForm"><label class="fieldlabel">Сколько добавить? (${esc(c.unit||'ед.')})</label><input class="input" type="number" min="0" step="any" name="amount" required><button class="btn" style="width:100%">Сохранить прогресс</button></form>`);$('#progressForm').onsubmit=e=>{e.preventDefault();c.progress=(Number(c.progress)||0)+Number(new FormData(e.currentTarget).get('amount'));save();closeModal();render()}});
}
function homeForm(x={}){simpleForm(x.id?'Изменить запись':'Новая запись',`<label class="fieldlabel">Название</label><input class="input" name="title" required value="${esc(x.title||'')}"><label class="fieldlabel">Тип</label><select class="input" name="kind"><option ${x.kind==='Домашнее дело'?'selected':''}>Домашнее дело</option><option ${x.kind==='Покупки'?'selected':''}>Покупки</option><option ${x.kind==='Семейный план'?'selected':''}>Семейный план</option><option ${!x.kind||x.kind==='Идея'?'selected':''}>Идея</option></select><label class="fieldlabel">Заметка</label><textarea class="input" name="text" rows="3">${esc(x.text||'')}</textarea>`,f=>{let o={id:x.id||Date.now(),title:f.get('title').trim(),kind:f.get('kind'),text:f.get('text')};if(x.id)state.homeItems=state.homeItems.map(v=>v.id===x.id?o:v);else state.homeItems.push(o);save()})}
function healthForm(x={}){simpleForm(x.id?'Изменить активность':'Новая активность',`<label class="fieldlabel">Что ты сделала?</label><input class="input" name="title" required value="${esc(x.title||'')}"><div class="grid2"><div><label class="fieldlabel">Дата</label><input class="input" type="date" name="date" value="${esc(x.date||today())}"></div><div><label class="fieldlabel">Количество</label><input class="input" name="amount" type="number" min="0" step="any" value="${esc(x.amount||'')}"></div></div><label class="fieldlabel">Единица учёта</label><select class="input" name="unit"><option ${x.unit==='мин.'?'selected':''}>мин.</option><option ${x.unit==='км'?'selected':''}>км</option><option ${x.unit==='раз'?'selected':''}>раз</option><option ${x.unit==='шагов'?'selected':''}>шагов</option><option ${x.unit==='стаканов'?'selected':''}>стаканов</option><option ${!x.unit?'selected':''}>без учёта</option></select><label class="fieldlabel">Заметка</label><textarea class="input" name="note" rows="2">${esc(x.note||'')}</textarea>`,f=>{let o={id:x.id||Date.now(),title:f.get('title').trim(),date:f.get('date')||today(),amount:f.get('amount'),unit:f.get('unit'),note:f.get('note')};if(x.id)state.healthItems=state.healthItems.map(v=>v.id===x.id?o:v);else state.healthItems.push(o);save()})}
function habitForm(x={}){simpleForm(x.id?'Изменить привычку':'Новая привычка',`<label class="fieldlabel">Название привычки</label><input class="input" name="title" required value="${esc(x.title||'')}"><label class="fieldlabel">Как учитывать?</label><select class="input" name="method"><option ${!x.method||x.method==='Отметка'?'selected':''}>Отметка</option><option ${x.method==='Минуты'?'selected':''}>Минуты</option><option ${x.method==='Количество'?'selected':''}>Количество</option><option ${x.method==='Раз'?'selected':''}>Раз</option></select><label class="fieldlabel">Облегчённый вариант (необязательно)</label><input class="input" name="light" value="${esc(x.light||'')}" placeholder="Например, 5 минут вместо 30">`,f=>{let o={id:x.id||Date.now(),title:f.get('title').trim(),method:f.get('method'),light:f.get('light')};if(x.id)state.habits=state.habits.map(v=>v.id===x.id?o:v);else state.habits.push(o);save()})}
function challengeForm(x={}){simpleForm(x.id?'Изменить челлендж':'Новый челлендж',`<label class="fieldlabel">Название цели</label><input class="input" name="title" required value="${esc(x.title||'')}"><div class="grid2"><div><label class="fieldlabel">Начало</label><input class="input" type="date" name="start" value="${esc(x.start||today())}"></div><div><label class="fieldlabel">Окончание</label><input class="input" type="date" name="end" value="${esc(x.end||'')}"></div><div><label class="fieldlabel">Целевое значение</label><input class="input" type="number" min="0" step="any" name="goal" value="${esc(x.goal||'')}"></div><div><label class="fieldlabel">Единица</label><input class="input" name="unit" value="${esc(x.unit||'')}" placeholder="страниц, км, занятий"></div></div>`,f=>{let o={id:x.id||Date.now(),title:f.get('title').trim(),start:f.get('start'),end:f.get('end'),goal:f.get('goal'),unit:f.get('unit'),progress:Number(x.progress)||0,status:x.status||'Активен'};if(x.id)state.challenges=state.challenges.map(v=>v.id===x.id?o:v);else state.challenges.push(o);save()})}
render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
