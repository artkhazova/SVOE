<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#414936"><meta name="description" content="СВОЁ — личная система организации жизни. Живи в своём ритме."><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>СВОЁ — Живи в своём ритме</title>
<style>
:root{--olive:#414936;--burgundy:#642f3d;--ochre:#a97835;--beige:#e8ddcb;--ivory:#f5efe5;--ink:#292b25;--muted:#77766d;--line:#ddd3c3;--paper:#fbf8f2;--shadow:0 8px 28px #302a2010}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px;line-height:1.45}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:92px}.top{padding:22px 22px 12px;background:linear-gradient(145deg,var(--olive),#30382c);color:var(--ivory);border-radius:0 0 26px 26px}.brand{display:flex;align-items:center;gap:12px}.sun{font-size:30px;color:#d5ad69}.brandname{font-family:Georgia,serif;font-size:30px;letter-spacing:.04em}.tagline{font-family:Georgia,serif;font-style:italic;color:#e8ddcb;margin:3px 0 0 43px;font-size:15px}.date{font-size:13px;color:#e8ddcbbd;margin-top:18px;letter-spacing:.04em}.content{padding:18px 18px 26px}.page-title{font-family:Georgia,serif;font-weight:500;font-size:29px;margin:5px 0 5px;color:var(--olive)}.subtle{color:var(--muted);font-size:14px}.card{background:#fffdf9;border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0;box-shadow:var(--shadow)}.card h2{font:500 20px Georgia,serif;color:var(--olive);margin:0 0 8px}.card h3{font-size:16px;margin:0 0 9px}.eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ochre);font-weight:700}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:#fff;color:var(--ink);font-size:14px}.chip.active{background:var(--olive);border-color:var(--olive);color:white}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.btn{border:0;border-radius:12px;padding:11px 15px;background:var(--olive);color:white;font-weight:600}.btn.secondary{background:#eee8dc;color:var(--olive);border:1px solid var(--line)}.btn.burgundy{background:var(--burgundy)}.btn.small{padding:7px 10px;font-size:13px}.input,select,textarea{width:100%;border:1px solid var(--line);background:#fffdf9;border-radius:11px;padding:12px;color:var(--ink);margin:5px 0 10px}.fieldlabel{display:block;font-size:13px;color:var(--muted);margin-top:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.task{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid #eee8dd}.task:last-child{border:0}.check{width:21px;height:21px;accent-color:var(--olive);margin-top:2px}.tasktitle{font-weight:600}.taskmeta{font-size:12px;color:var(--muted);margin-top:2px}.done .tasktitle{text-decoration:line-through;color:#999}.pill{font-size:11px;border-radius:99px;padding:3px 8px;background:#eee8dc;color:var(--olive);white-space:nowrap}.timeline{border-left:2px solid var(--line);margin:12px 0 0 8px;padding-left:15px}.timeitem{position:relative;padding:0 0 16px}.timeitem:before{content:"";position:absolute;left:-22px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--ochre);border:2px solid var(--paper)}.empty{padding:16px;text-align:center;color:var(--muted);font-size:14px}.nav{position:fixed;z-index:5;bottom:0;left:0;right:0;background:#fbf8f2f2;backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 5px calc(8px + env(safe-area-inset-bottom));gap:2px}.nav button{border:0;background:transparent;color:var(--muted);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 10px;border-radius:12px;min-width:62px}.nav button span:first-child{font-size:20px}.nav button.active{color:var(--burgundy);background:#642f3d10;font-weight:700}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.tabs button{border:1px solid var(--line);background:transparent;border-radius:9px;padding:8px 11px;color:var(--muted);font-size:13px}.tabs button.active{background:var(--beige);color:var(--ink);border-color:var(--beige)}.modalback{position:fixed;inset:0;background:#16181277;z-index:10;display:flex;align-items:flex-end;justify-content:center}.modal{background:var(--paper);border-radius:22px 22px 0 0;padding:20px;width:min(100%,700px);max-height:90vh;overflow:auto}.modal h2{font:500 24px Georgia,serif;color:var(--olive);margin:0 0 12px}.close{border:0;background:#eee8dc;border-radius:50%;width:34px;height:34px}.hidden{display:none!important}.notice{background:#f0e8d9;border-left:3px solid var(--ochre);padding:12px;border-radius:8px;font-size:14px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.day{border:1px solid var(--line);border-radius:10px;padding:9px 2px;font-size:12px;background:#fff}.day.today{background:var(--olive);color:white;border-color:var(--olive)}.day small{display:block;color:inherit;opacity:.7}.sectionlink{display:flex;justify-content:space-between;align-items:center;padding:14px 2px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}.sectionlink:last-child{border:0}.footer-note{text-align:center;color:var(--muted);font:italic 13px Georgia,serif;margin:24px 0 8px}
@media(min-width:600px){.content{padding:24px 28px}.top{padding:26px 30px}.modalback{align-items:center}.modal{border-radius:22px}}
</style></head><body><div class="app"><header class="top"><div class="brand"><span class="sun">☼</span><span class="brandname">своё</span></div><div class="tagline">Живи в своём ритме.</div><div class="date" id="todayDate"></div></header><main class="content" id="view"></main><nav class="nav" id="nav"><button data-page="day" class="active"><span>☼</span><span>Мой день</span></button><button data-page="calendar"><span>▦</span><span>Календарь</span></button><button data-page="tasks"><span>☷</span><span>Мои задачи</span></button><button data-page="life"><span>❧</span><span>Моя жизнь</span></button><button data-page="diary"><span>✎</span><span>Дневник</span></button></nav></div><div id="modalRoot"></div>
<script>
const KEY='svoe_v2_state';const defaults={energy:'',mood:'',tasks:[],notes:[],viewMode:'timeline',closedState:false,evening:{}};let state={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')};let page='day',lifeSection='';const $=s=>document.querySelector(s);const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const dateLabel=()=>new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date());$('#todayDate').textContent=dateLabel();
function setPage(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)setPage(b.dataset.page)});
function taskCard(t){return `<div class="task ${t.done?'done':''}"><input class="check" type="checkbox" data-done="${t.id}" ${t.done?'checked':''}><div style="flex:1"><div class="row"><span class="tasktitle">${esc(t.title)}</span><span class="pill">${esc(t.priority||'По возможности')}</span></div><div class="taskmeta">${esc(t.category||'Без категории')}${t.date?' · '+t.date:''}${t.time?' · '+t.time:''}${t.duration?' · '+t.duration+' мин.':''}</div></div><button class="btn secondary small" data-edit="${t.id}">Изменить</button></div>`}
function dayTasks(){return state.tasks.filter(t=>t.date===today()).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'))}
function renderDay(){let tasks=dayTasks(),open=tasks.filter(t=>!t.done);return `<div class="eyebrow">ТВОЙ ДЕНЬ</div><h1 class="page-title">Сегодня</h1><p class="subtle">Пусть планы поддерживают тебя, а не наоборот.</p>
${!state.closedState&&!state.energy&&!state.mood?`<div class="card"><div class="row"><h2>Как ты сегодня?</h2><button class="close" aria-label="Закрыть" id="closeState">×</button></div><p class="subtle">Если захочешь, отметь своё состояние. Это необязательно.</p><h3>Сколько у тебя сил?</h3><div class="chips">${['Почти нет сил','Мало сил','Умеренно','Хорошо','Много сил'].map(x=>`<button class="chip ${state.energy===x?'active':''}" data-energy="${x}">${x}</button>`).join('')}</div><h3 style="margin-top:15px">Что ты сейчас чувствуешь?</h3><div class="chips">${['Спокойствие','Радость','Воодушевление','Нейтральное состояние','Тревога','Грусть','Подавленность','Раздражение','Опустошённость','Растерянность','Не могу определить'].map(x=>`<button class="chip ${state.mood===x?'active':''}" data-mood="${x}">${x}</button>`).join('')}</div></div>`:''}
${state.energy||state.mood?`<div class="card"><div class="row"><div><div class="eyebrow">МОЁ СОСТОЯНИЕ</div><strong>${esc(state.energy||'Не отмечено')}</strong><div class="subtle">${esc(state.mood||'Настроение не отмечено')}</div></div><button class="btn secondary small" id="editState">Изменить</button></div></div>`:''}
<div class="card"><div class="row"><h2>План на сегодня</h2><div class="tabs" style="margin:0"><button data-mode="timeline" class="${state.viewMode==='timeline'?'active':''}">По времени</button><button data-mode="list" class="${state.viewMode==='list'?'active':''}">Списком</button></div></div><div class="row"><span class="subtle">${open.length} незавершённых дел</span><button class="btn small" id="quickAdd">＋ Добавить дело</button></div>${tasks.length?(state.viewMode==='list'?tasks.map(taskCard).join(''):`<div class="timeline">${tasks.map(t=>`<div class="timeitem">${t.time?`<div class="eyebrow">${esc(t.time)}</div>`:''}${taskCard(t)}</div>`).join('')}</div>`):`<div class="empty">На сегодня пока ничего не запланировано. Можно оставить день свободным.</div>`}</div>
<div class="card"><div class="row"><h2>Небольшая пауза</h2><span class="pill">без обязательств</span></div><p class="subtle">Оставь в дне немного пространства для отдыха и того, что тебе сейчас нужно.</p><button class="btn secondary small" id="addRest">Добавить время для отдыха</button></div>
<div class="card"><div class="eyebrow">ВЕЧЕР</div><h2>Завершение дня</h2><p class="subtle">Можно подвести итоги здесь или перейти к записи в дневнике. А можно ничего не делать.</p><div class="chips"><button class="btn secondary" id="eveningSummary">Итог дня</button><button class="btn secondary" id="toDiary">Открыть дневник</button></div></div>`}
function renderTasks(){let cats=[...new Set(state.tasks.map(t=>t.category||'Без категории'))];return `<div class="eyebrow">ТВОИ ДЕЛА</div><h1 class="page-title">Мои задачи</h1><p class="subtle">Здесь собраны все дела — в том числе те, которым пока не назначена дата.</p><div class="row"><span></span><button class="btn" id="fullAdd">＋ Новая задача</button></div>${cats.length?cats.map(c=>`<div class="card"><h2>${esc(c)}</h2>${state.tasks.filter(t=>(t.category||'Без категории')===c).sort((a,b)=>['Обязательно','Желательно','По возможности'].indexOf(a.priority)-['Обязательно','Желательно','По возможности'].indexOf(b.priority)).map(taskCard).join('')}</div>`).join(''):`<div class="card empty">Пока здесь пусто. Добавь задачу — дату можно назначить позже.</div>`}`}
function renderCalendar(){let d=new Date(),first=new Date(d.getFullYear(),d.getMonth(),1),days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),offset=(first.getDay()+6)%7;return `<div class="eyebrow">ПЛАНЫ И СОБЫТИЯ</div><h1 class="page-title">Календарь</h1><div class="card"><h2>${new Intl.DateTimeFormat('ru-RU',{month:'long',year:'numeric'}).format(d)}</h2><div class="week">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div class="subtle">${x}</div>`).join('')}${Array(offset).fill('<div></div>').join('')}${Array.from({length:days},(_,i)=>{let n=i+1,ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`,count=state.tasks.filter(t=>t.date===ds).length;return `<div class="day ${ds===today()?'today':''}">${n}<small>${count?'•':''}</small></div>`}).join('')}</div></div><div class="card"><h2>Задачи с датой</h2>${state.tasks.filter(t=>t.date).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(taskCard).join('')||'<div class="empty">Задач с назначенной датой пока нет.</div>'}</div>`}
function renderLife(){let sections=[['Дом','Идеи для дома, семейные дела и покупки'],['Здоровье и движение','Движение, забота о себе и восстановление'],['Привычки','Повторяющиеся действия в своём ритме'],['Мои челленджи','Личные и семейные цели без давления']];if(lifeSection){let desc=sections.find(x=>x[0]===lifeSection)?.[1]||'';return `<button class="btn secondary small" id="lifeBack">← Моя жизнь</button><h1 class="page-title">${esc(lifeSection)}</h1><p class="subtle">${esc(desc)}</p><div class="card"><h2>${esc(lifeSection)}</h2><p class="subtle">Этот модуль будет развиваться следующим этапом. Здесь появятся личные записи и инструменты раздела, без обязательного заполнения.</p></div>`}return `<div class="eyebrow">ЛИЧНОЕ ПРОСТРАНСТВО</div><h1 class="page-title">Моя жизнь</h1><p class="subtle">Небольшие опоры для повседневной жизни.</p><div class="card">${sections.map(([n,d])=>`<a class="sectionlink" href="#" data-life="${n}"><div><strong>${n}</strong><div class="subtle">${d}</div></div><span>›</span></a>`).join('')}</div>`}
function renderDiary(){return `<div class="eyebrow">ЛИЧНОЕ ПРОСТРАНСТВО</div><h1 class="page-title">Дневник</h1><p class="subtle">Место для мыслей, воспоминаний и маленьких открытий.</p><div class="card"><h2>Что хочется сохранить?</h2><textarea id="diaryText" rows="5" placeholder="Запиши то, что важно именно сегодня…"></textarea><button class="btn" id="saveDiary">Сохранить запись</button></div>${state.notes.slice().reverse().map(n=>`<div class="card"><div class="eyebrow">${esc(n.date)}</div><p style="white-space:pre-wrap">${esc(n.text)}</p></div>`).join('')}`}
function render(){let html=page==='day'?renderDay():page==='tasks'?renderTasks():page==='calendar'?renderCalendar():page==='life'?renderLife():renderDiary();$('#view').innerHTML=html;bind()}
function modal(title,body){$('#modalRoot').innerHTML=`<div class="modalback" id="backdrop"><div class="modal"><div class="row"><h2>${title}</h2><button class="close" id="modalClose">×</button></div>${body}</div></div>`;$('#modalClose').onclick=closeModal;$('#backdrop').onclick=e=>{if(e.target.id==='backdrop')closeModal()}}
function closeModal(){$('#modalRoot').innerHTML=''}
function taskForm(t={}){modal(t.id?'Изменить задачу':'Новая задача',`<form id="taskForm"><label class="fieldlabel">Название дела *</label><input class="input" name="title" required value="${esc(t.title||'')}" placeholder="Например, подготовить материалы"><div class="grid2"><div><label class="fieldlabel">Категория</label><input class="input" name="category" value="${esc(t.category||'')}" placeholder="Личное, работа…"></div><div><label class="fieldlabel">Приоритет</label><select name="priority"><option ${t.priority==='Обязательно'?'selected':''}>Обязательно</option><option ${t.priority==='Желательно'?'selected':''}>Желательно</option><option ${!t.priority||t.priority==='По возможности'?'selected':''}>По возможности</option></select></div><div><label class="fieldlabel">Дата</label><input class="input" type="date" name="date" value="${esc(t.date||'')}"></div><div><label class="fieldlabel">Время</label><input class="input" type="time" name="time" value="${esc(t.time||'')}"></div><div><label class="fieldlabel">Длительность, мин.</label><input class="input" type="number" min="0" name="duration" value="${esc(t.duration||'')}"></div></div><label class="fieldlabel">Заметка</label><textarea class="input" name="note" rows="2">${esc(t.note||'')}</textarea><button class="btn" style="width:100%" type="submit">Сохранить задачу</button>${t.id?'<button class="btn secondary" style="width:100%;margin-top:8px" type="button" id="deleteTask">Удалить задачу</button>':''}</form>`);$('#taskForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),obj={id:t.id||Date.now(),title:f.get('title').trim(),category:f.get('category').trim()||'Без категории',priority:f.get('priority'),date:f.get('date'),time:f.get('time'),duration:f.get('duration'),note:f.get('note'),done:t.done||false};if(t.id)state.tasks=state.tasks.map(x=>x.id===t.id?obj:x);else state.tasks.push(obj);save();closeModal();render()};if(t.id)$('#deleteTask').onclick=()=>{if(confirm('Удалить задачу?')){state.tasks=state.tasks.filter(x=>x.id!==t.id);save();closeModal();render()}}}
function bind(){document.querySelectorAll('[data-energy]').forEach(b=>b.onclick=()=>{state.energy=b.dataset.energy;save();render()});document.querySelectorAll('[data-mood]').forEach(b=>b.onclick=()=>{state.mood=b.dataset.mood;save();render()});$('#closeState')?.addEventListener('click',()=>{state.closedState=true;save();render()});$('#editState')?.addEventListener('click',()=>{state.closedState=false;state.energy='';state.mood='';save();render()});$('#quickAdd')?.addEventListener('click',()=>{modal('Быстрое добавление',`<form id="quickForm"><label class="fieldlabel">Что нужно сделать?</label><input class="input" name="title" required autofocus placeholder="Название дела"><p class="subtle">Задача будет добавлена в план на сегодня. При желании дату можно изменить в полном режиме.</p><button class="btn" style="width:100%">Сохранить</button><button type="button" class="btn secondary" id="openFull" style="width:100%;margin-top:8px">Заполнить все параметры</button></form>`);$('#openFull')?.addEventListener('click',()=>{let title=$('#quickForm [name=title]').value;closeModal();taskForm({title,date:today()})});$('#quickForm')?.addEventListener('submit',e=>{e.preventDefault();const formData=new FormData(e.currentTarget);const title=String(formData.get('title')||'').trim();if(!title)return;state.tasks.push({id:Date.now(),title,category:'Без категории',priority:'По возможности',date:today(),time:'',done:false});save();closeModal();render()})});$('#fullAdd')?.addEventListener('click',()=>taskForm());document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>taskForm(state.tasks.find(t=>t.id==b.dataset.edit)));document.querySelectorAll('[data-done]').forEach(b=>b.onchange=()=>{let t=state.tasks.find(t=>t.id==b.dataset.done);if(t)t.done=b.checked;save();render()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.viewMode=b.dataset.mode;save();render()});$('#addRest')?.addEventListener('click',()=>taskForm({title:'Время для отдыха',category:'Здоровье и движение',priority:'По возможности',date:today()}));$('#toDiary')?.addEventListener('click',()=>setPage('diary'));$('#eveningSummary')?.addEventListener('click',()=>{let done=dayTasks().filter(t=>t.done).length,unfinished=dayTasks().filter(t=>!t.done).length;modal('Итог дня',`<div class="notice">Сегодня выполнено дел: <strong>${done}</strong>. Осталось незавершённых: <strong>${unfinished}</strong>. Это просто сводка, не оценка дня.</div><label class="fieldlabel">Как прошёл день?</label><textarea class="input" id="eveningNote" rows="4" placeholder="Можно добавить пару слов…">${esc(state.evening[today()]||'')}</textarea><button class="btn" id="saveEvening" style="width:100%">Сохранить итог</button>`);$('#saveEvening').onclick=()=>{state.evening[today()]=$('#eveningNote').value;save();closeModal()}});$('#saveDiary')?.addEventListener('click',()=>{let text=$('#diaryText').value.trim();if(text){state.notes.push({date:today(),text});save();render()}});document.querySelectorAll('[data-life]').forEach(a=>a.onclick=e=>{e.preventDefault();lifeSection=a.dataset.life;render()});$('#lifeBack')?.addEventListener('click',()=>{lifeSection='';render()})}
render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
